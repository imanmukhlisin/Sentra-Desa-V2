# =========================================================
# GitLab CI/CD Pipeline — SENTRA DESA V2
# Automasi Build & Deploy ke VPS Production (45.80.181.191)
# =========================================================

stages:
  - build
  - deploy

variables:
  VPS_HOST: "45.80.181.191"
  VPS_USER: "root"
  BACKEND_DEST: "/var/www/sentradesa.id/sentra-desa-backend"
  FRONTEND_DEST: "/var/www/html/sentradesa.id/nextjs"

# ---------------------------------------------------------
# STAGE 1: BUILD FRONTEND (Next.js 14 SSG)
# ---------------------------------------------------------
build_frontend:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - sentra-desa-frontend/package-lock.json
    paths:
      - sentra-desa-frontend/.npm/
  before_script:
    - cd sentra-desa-frontend
  script:
    - npm ci --cache .npm --prefer-offline || npm install
    - npm run build
  artifacts:
    name: "frontend-build-$CI_COMMIT_SHORT_SHA"
    paths:
      - sentra-desa-frontend/out/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production"'

# ---------------------------------------------------------
# STAGE 2: DEPLOY KE VPS (Laravel Backend + Next.js Frontend)
# ---------------------------------------------------------
deploy_to_vps:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build_frontend
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "=== 1. Deploying Backend to VPS ==="
    - >-
      rsync -avz
      --exclude='.env*'
      --exclude='vendor/'
      --exclude='node_modules/'
      --exclude='.git/'
      --exclude='storage/'
      --exclude='bootstrap/cache/*'
      --exclude='.phpunit.*'
      sentra-desa-backend/
      "$VPS_USER@$VPS_HOST:$BACKEND_DEST/"
    - echo "=== 2. Deploying Frontend to VPS ==="
    - rsync -avz sentra-desa-frontend/out/ "$VPS_USER@$VPS_HOST:$FRONTEND_DEST/"
    - echo "=== 3. Running Post-Deployment Tasks on Server ==="
    - |
      ssh "$VPS_USER@$VPS_HOST" bash -s << 'EOF'
      set -e
      cd /var/www/sentradesa.id/sentra-desa-backend
      COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev --ignore-platform-reqs
      php artisan migrate --force
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      chown -R www-data:www-data .
      chmod -R 755 app/ config/ routes/ database/ resources/ storage/ bootstrap/
      chmod -R 644 app/**/*.php config/*.php routes/*.php 2>/dev/null || true
      chown -R www-data:www-data /var/www/html/sentradesa.id/nextjs
      chmod -R 755 /var/www/html/sentradesa.id/nextjs
      nginx -t && systemctl reload nginx
      EOF
    - echo "=== Deployment Selesai! Website live di https://sentradesa.id ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production"'
